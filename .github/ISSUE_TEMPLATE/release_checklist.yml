name: Release checklist
description: Track a release or publishing change.
title: "[Release] "
labels:
  - area:release
  - risk:high
  - needs-human-decision
body:
  - type: textarea
    id: scope
    attributes:
      label: Release scope
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts and targets
      description: PyPI, Test PyPI, Anaconda, documentation, or other targets.
    validations:
      required: true
  - type: textarea
    id: dry_run
    attributes:
      label: Dry-run evidence
      description: Package build, twine check, installed-artifact smoke, and staging publish evidence.
    validations:
      required: true
  - type: textarea
    id: approvals
    attributes:
      label: Human/admin approvals
    validations:
      required: true
