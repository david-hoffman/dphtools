name: Create Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke package
    runs-on: ubuntu-latest
    if: github.repository == 'david-hoffman/dphtools'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel twine
      - name: Build source and wheel distributions
        run: |
          python setup.py sdist bdist_wheel
      - name: Check package metadata
        run: |
          python -m twine check dist/*
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/dphtools-release-smoke
          /tmp/dphtools-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/dphtools-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/dphtools-release-smoke/bin/python - <<'PY'
          import dphtools

          assert dphtools.__version__
          print(dphtools.__version__)
          PY
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish distribution to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TESTPYPI_TOKEN }}
          repository_url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    if: success() && !contains(github.ref, 'rc')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish-conda:
    name: Publish to Anaconda
    needs: publish-pypi
    if: success() && !contains(github.ref, 'rc')
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Publish Conda package to Anaconda.org
        uses: maxibor/conda-package-publish-action@v1.1
        with:
          subDir: "conda.recipe"
          AnacondaToken: ${{ secrets.ANACONDA_TOKEN }}
