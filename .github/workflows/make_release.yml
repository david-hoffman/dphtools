name: Prepare and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical unprefixed release version
        required: true
        type: string
      resume_run:
        description: Original run ID to recover retained files (empty for new preparation)
        required: false
        default: ''
        type: string
      notes:
        description: Owner-reviewed release notes and compatibility impact
        required: false
        default: 'Release notes and compatibility impact require owner review before approval.'
        type: string

permissions:
  contents: read

# Never cancel a partially published release. All versions share this lock.
concurrency:
  group: dphtools-release-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'david-hoffman/dphtools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
      origin_run: ${{ steps.identity.outputs.origin_run }}
      artifact_id: ${{ steps.identity.outputs.artifact_id }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
      resume: ${{ steps.identity.outputs.resume }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - id: identity
        name: Freeze source and original artifact identity
        env:
          VERSION: ${{ inputs.version }}
          RESUME_RUN: ${{ inputs.resume_run }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python tools/release_workflow.py resolve --version "$VERSION" --resume "$RESUME_RUN"

  verify:
    needs: resolve
    if: needs.resolve.outputs.resume == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Prepare local Versioneer tag at the frozen source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git tag -- "$VERSION" "$SOURCE_SHA"
      - name: Canonical full verification
        run: python tools/verification.py full
      - name: Build the only retained release pair on Linux
        if: matrix.os == 'ubuntu-24.04'
        run: python -m build --no-isolation --outdir release-dist
      - name: Retain full diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-verification-${{ matrix.os }}
          path: reports/verification/
          if-no-files-found: error
          retention-days: 30
      - name: Retain the Linux-built pair
        if: success() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-distributions
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: [resolve, verify]
    if: always() && needs.resolve.result == 'success' && (needs.verify.result == 'success' || (needs.resolve.outputs.resume == 'true' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id || needs.resolve.outputs.artifact_id }}
      artifact_digest: ${{ steps.retained.outputs.artifact-digest || needs.resolve.outputs.artifact_digest }}
      manifest_digest: ${{ steps.summary.outputs.manifest_digest }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
      ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Download this run's successful verification reports
        if: needs.resolve.outputs.resume == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-verification-*
          path: evidence
      - name: Download this run's Linux-built pair
        if: needs.resolve.outputs.resume == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-distributions
          path: bundle/dist
      - name: Assemble manifest without rebuilding
        if: needs.resolve.outputs.resume == 'false'
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p bundle/reports
          for platform in ubuntu-24.04 macos-15 windows-2025; do
            mv "evidence/release-verification-$platform" "bundle/reports/$platform"
          done
          printf '%s\n' "$RELEASE_NOTES" > bundle/notes.md
          python tools/release.py manifest --version "$VERSION" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --run-id "$ORIGIN_RUN" --dist bundle/dist --reports bundle/reports --notes bundle/notes.md --output bundle/manifest.json
      - name: Verify original retained archive digest
        if: needs.resolve.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
        run: python tools/release_workflow.py artifact --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA"
      - name: Recover the original retained artifact by ID and run
        if: needs.resolve.outputs.resume == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.origin_run }}
          github-token: ${{ github.token }}
          repository: david-hoffman/dphtools
          merge-multiple: true
          path: bundle
      - name: Bind retained manifest to frozen selection
        run: python tools/release_workflow.py bind --manifest bundle/manifest.json --dist bundle/dist --version "$VERSION" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --origin-run "$ORIGIN_RUN"
      - name: Retain immutable bundle
        id: retained
        if: needs.resolve.outputs.resume == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Present owner approval evidence
        id: summary
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id || needs.resolve.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.retained.outputs.artifact-digest || needs.resolve.outputs.artifact_digest }}
        run: python tools/release_workflow.py summary --manifest bundle/manifest.json --dist bundle/dist --version "$VERSION" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  install-retained:
    needs: [resolve, bundle]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify exact original artifact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
          ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: python tools/release_workflow.py artifact --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.origin_run }}
          github-token: ${{ github.token }}
          repository: david-hoffman/dphtools
          merge-multiple: true
          path: bundle
      - name: Clean retained wheel and Git-unavailable source installations
        run: python tools/release.py smoke --manifest bundle/manifest.json --dist bundle/dist > retained-install.log 2>&1
      - name: Retain installation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-install-${{ matrix.os }}
          path: retained-install.log
          if-no-files-found: error
          retention-days: 90

  publisher:
    needs: [resolve, bundle, install-retained]
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolve.outputs.channel == 'pypi' && 'pypi' || 'test-pypi' }}
    permissions:
      contents: write # Only the approved frozen tag; never candidate execution.
      actions: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
      ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
      MANIFEST_DIGEST: ${{ needs.bundle.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify exact original artifact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
          ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: python tools/release_workflow.py artifact --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.origin_run }}
          github-token: ${{ github.token }}
          repository: david-hoffman/dphtools
          merge-multiple: true
          path: bundle
      - name: Recheck approved source membership and tag identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_workflow.py tag --manifest bundle/manifest.json --dist bundle/dist --version "$VERSION" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --origin-run "$ORIGIN_RUN" --manifest-digest "$MANIFEST_DIGEST"
      - name: Reconcile verified registry bytes and stage only missing originals
        id: reconcile
        run: |
          python tools/release.py reconcile --manifest bundle/manifest.json --dist bundle/dist --output upload > publication-receipt.json
          if find upload -type f -print -quit | grep -q .; then
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'missing=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish missing originals to PyPI with default attestations
        if: steps.reconcile.outputs.missing == 'true' && needs.resolve.outputs.channel == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload/
      - name: Publish missing originals to TestPyPI with default attestations
        if: steps.reconcile.outputs.missing == 'true' && needs.resolve.outputs.channel == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
      - name: Retain partial publication diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-attempt
          path: publication-receipt.json
          if-no-files-found: warn
          retention-days: 90

  install-published:
    needs: [resolve, bundle, publisher]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify exact original artifact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
          ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: python tools/release_workflow.py artifact --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.origin_run }}
          github-token: ${{ github.token }}
          repository: david-hoffman/dphtools
          merge-multiple: true
          path: bundle
      - name: Download and verify exact published bytes then smoke both installations
        run: |
          python tools/release.py reconcile --manifest bundle/manifest.json --dist bundle/dist --output empty-staging --require-complete --downloaded published-dist > published-receipt.json
          python tools/release.py smoke --manifest bundle/manifest.json --dist published-dist > published-install.log 2>&1
      - name: Retain published installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-install-${{ matrix.os }}
          path: |
            published-receipt.json
            published-install.log
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: [resolve, bundle, install-published]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
      ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
      MANIFEST_DIGEST: ${{ needs.bundle.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify exact original artifact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
          ORIGIN_RUN: ${{ needs.resolve.outputs.origin_run }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: python tools/release_workflow.py artifact --origin-run "$ORIGIN_RUN" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.origin_run }}
          github-token: ${{ github.token }}
          repository: david-hoffman/dphtools
          merge-multiple: true
          path: bundle
      - name: Recheck complete registry bytes for final receipt
        run: python tools/release.py reconcile --manifest bundle/manifest.json --dist bundle/dist --output empty-staging --require-complete > publication-receipt.json
      - name: Finalize GitHub Release after all published installation jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_workflow.py finalize --manifest bundle/manifest.json --dist bundle/dist --version "$VERSION" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --origin-run "$ORIGIN_RUN" --manifest-digest "$MANIFEST_DIGEST" --receipt publication-receipt.json
      - name: Record completed workflow status
        run: |
          echo "Release $VERSION completed from $SOURCE_SHA; original run $ORIGIN_RUN." >> "$GITHUB_STEP_SUMMARY"
          cat publication-receipt.json >> "$GITHUB_STEP_SUMMARY"
