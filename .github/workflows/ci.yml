name: ci

on:
  push:
    branches: [main, codex-main]
  pull_request:
    branches: [main, codex-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run the complete verification gate for this platform
        run: python tools/verification.py full
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: reports/verification/
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: ci-required
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every platform to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
