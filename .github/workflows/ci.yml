name: ci

on:
  push:
    branches: [main, codex-main]
  pull_request:
    branches: [main, codex-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check formatting
        run: python -m black --check --line-length 99 dphtools tests tools/delivery setup.py versioneer.py notebooks
      - name: Check critical lint and docstrings
        run: |
          python -m flake8 dphtools tests tools/delivery setup.py versioneer.py
          python -m pydocstyle --count dphtools
      - name: Check types
        run: python -m mypy --follow-untyped-imports dphtools tools/delivery
      - name: Audit locked dependencies
        run: python -m pip_audit --require-hashes -r requirements-dev.lock
      - name: Build and install the distribution
        run: |
          python -m build --no-isolation
          python -m pip install --no-deps --no-build-isolation .
      - name: Exercise public behavior and doctests
        run: python -m coverage run -m pytest --doctest-modules dphtools tests -ra --junitxml=reports/pytest.xml
      - name: Combine coverage
        if: always()
        run: python -m coverage combine
      - name: Write exact coverage JSON, including never-imported owned files
        if: always()
        run: python -m coverage json -o reports/coverage.json dphtools/*.py dphtools/utils/*.py tools/delivery
      - name: Write coverage XML
        if: always()
        run: python -m coverage xml -o reports/coverage.xml dphtools/*.py dphtools/utils/*.py tools/delivery
      - name: Require complete statement and branch coverage
        if: always()
        run: python -m coverage report --fail-under=100 dphtools/*.py dphtools/utils/*.py tools/delivery
      - name: Reject missing, empty, or skipped test results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = ElementTree.parse('reports/pytest.xml')
          suites = list(report.iter('testsuite'))
          assert suites and sum(int(s.get('tests', 0)) for s in suites) > 0, 'No tests ran'
          assert all(int(s.get('skipped', 0)) == 0 for s in suites), 'Unexpected skipped tests'
          assert Path('reports/coverage.json').is_file(), 'Missing coverage report'
          PY
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: ci-required
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every platform to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
