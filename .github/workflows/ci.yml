name: ci

on:
  push:
    branches: [main, codex-main]
  pull_request:
    branches: [main, codex-main]
  workflow_dispatch:

permissions:
  contents: read

# Two test workers per platform. Each job has its own machine, checkout,
# interpreter, locked environment, install destinations and temporary directories.
# Collection and aggregation never pool coverage from different platforms.
jobs:
  plan:
    name: verification plan
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.plan.outputs.name }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python tools/verification.py classify --base "$BASE" --output reports/verification/plan.json
          python - <<'PYTHON'
          import json, os
          plan = json.load(open('reports/verification/plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('name=' + plan['name'] + '\nbase=' + os.environ['BASE'] + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-plan
          path: reports/verification/plan.json
          if-no-files-found: error

  fast:
    name: fast (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.name == 'fast' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/verification.py fast --report-dir reports/verification/fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-${{ matrix.os }}
          path: reports/verification/fast/
          include-hidden-files: true
          if-no-files-found: error

  collect:
    name: collect (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.name != 'fast' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock --dest "$RUNNER_TEMP/verification-wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/verification-wheels" --require-hashes -r requirements-dev.lock
      - name: Check prerequisites and freeze the complete selected test assignment
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/verification-wheels
          BASE: ${{ needs.plan.outputs.base }}
          PLAN_NAME: ${{ needs.plan.outputs.name }}
        run: |
          python tools/verification.py collect --base "$BASE" --report-dir reports/verification/collect --manifest reports/verification/collect/manifest.json --durations tools/verification-durations.json
          python - <<'PYTHON'
          import json, os
          checks = json.load(open('reports/verification/collect/checks.json'))
          assert checks['scope']['name'] == os.environ['PLAN_NAME'], 'Collection differs from native plan'
          PYTHON
      - name: Retain collection proof and immutable build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-${{ matrix.os }}
          path: |
            reports/verification/collect/*.json
            reports/verification/collect/*.log
            reports/verification/collect/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  shard:
    name: shard (${{ matrix.os }}, ${{ matrix.index }})
    needs: collect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        index: [0, 1]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock --dest "$RUNNER_TEMP/verification-wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/verification-wheels" --require-hashes -r requirements-dev.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: collection-${{ matrix.os }}
          path: reports/incoming/collection
      - name: Run only this worker's assigned tests with real child measurement
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/verification-wheels
        run: >-
          python tools/verification.py shard
          --report-dir reports/verification/shard
          --manifest reports/incoming/collection/manifest.json
          --shard-index ${{ matrix.index }} --shard-count 2
      - name: Retain raw parent and child coverage and execution proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-${{ matrix.os }}-${{ matrix.index }}
          path: |
            reports/verification/shard/*.json
            reports/verification/shard/*.xml
            reports/verification/shard/*.log
            reports/verification/shard/.coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate (${{ matrix.os }})
    needs: [plan, collect, shard]
    if: ${{ always() && needs.plan.result == 'success' && needs.collect.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: collection-${{ matrix.os }}
          path: reports/incoming/collection
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: shard-${{ matrix.os }}-*
          path: reports/incoming/shards
      - name: Require complete matching shards and exact selected-domain coverage for this platform
        run: >-
          python tools/verification.py aggregate
          --report-dir reports/verification/aggregate
          --manifest reports/incoming/collection/manifest.json
          --shards reports/incoming/shards/shard-${{ matrix.os }}-0 reports/incoming/shards/shard-${{ matrix.os }}-1
      - name: Retain platform coverage and validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            reports/verification/aggregate/*.json
            reports/verification/aggregate/*.xml
            reports/verification/aggregate/*.log
            reports/verification/aggregate/.coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: ci-required
    needs: [plan, fast, collect, shard, aggregate]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every complete platform gate to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_NAME: ${{ needs.plan.outputs.name }}
          FAST_RESULT: ${{ needs.fast.result }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$PLAN_NAME" in
            fast)
              test "$FAST_RESULT" = success
              test "$COLLECT_RESULT" = skipped
              test "$SHARD_RESULT" = skipped
              test "$AGGREGATE_RESULT" = skipped
              ;;
            library|doctor|release|full)
              test "$FAST_RESULT" = skipped
              test "$COLLECT_RESULT" = success
              test "$SHARD_RESULT" = success
              test "$AGGREGATE_RESULT" = success
              ;;
            *) exit 1 ;;
          esac
