[versioneer]
VCS = git
style = pep440
versionfile_source = dphtools/_version.py
versionfile_build = dphtools/_version.py
tag_prefix =
parentdir_prefix =

[pydocstyle]
match_dir = dphtools
convention = numpy

[coverage:run]
branch = True
parallel = True
patch = subprocess
include =
    */dphtools/*.py
    */dphtools/utils/*.py
    */tools/delivery
omit =
    # Versioneer-generated code; no handwritten runtime exclusions.
    */_version.py

[coverage:report]
omit = */_version.py
fail_under = 100
precision = 6
show_missing = True
skip_empty = False
exclude_lines =
    (?!x)x
partial_branches =
    (?!x)x

[coverage:paths]
delivery =
    tools
    */tools

[flake8]
select = E9,F63,F7,F82
count = True
show_source = True
statistics = True

[tool:pytest]
testpaths = tests
addopts = --strict-config --strict-markers
junit_family = xunit2
