[versioneer]
VCS = git
style = pep440
versionfile_source = dphtools/_version.py
versionfile_build = dphtools/_version.py
tag_prefix =
parentdir_prefix =

[pydocstyle]
match_dir = .*
match = .*\.py
convention = numpy

[coverage:run]
branch = True
parallel = True
patch = subprocess
include =
    */dphtools/**/*.py
    */tools/delivery
    */tools/**/*.py
omit =
    # Versioneer-generated code; no handwritten runtime exclusions.
    dphtools/_version.py

[coverage:report]
omit = dphtools/_version.py
# Coverage percentages are advisory under the approved behavior/risk policy.
fail_under = 0
precision = 6
show_missing = True
skip_empty = False
exclude_lines =
    (?!x)x
partial_branches =
    (?!x)x

[coverage:paths]
delivery =
    tools
    */tools

[flake8]
select = E9,F63,F7,F82
count = True
show_source = True
statistics = True

[tool:pytest]
testpaths = tests
addopts = --strict-config --strict-markers
junit_family = xunit2

[mypy]
follow_untyped_imports = True

[mypy-scipy.*]
# SciPy's untyped dynamic exports produced false missing-attribute errors.
# Its API boundary remains dynamically checked by public behavior tests.
follow_imports = skip
ignore_missing_imports = True
